<c-vars tone="slate" class="" />
<span class="inline-flex items-center whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-medium
    {% if tone == 'teal' %}bg-teal-100 text-teal-700 dark:bg-teal-500/10 dark:text-teal-300
    {% elif tone == 'rose' %}bg-rose-100 text-rose-700 dark:bg-rose-500/10 dark:text-rose-300
    {% elif tone == 'amber' %}bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-300
    {% else %}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300
    {% endif %} {{ class }}">{{ slot }}</span>
