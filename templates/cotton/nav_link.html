<c-vars href active=False class="" />
<a
  href="{{ href }}"
  class="rounded-lg px-3 py-2 text-sm font-medium transition
    {% if active %}bg-teal-50 text-teal-700 dark:bg-teal-500/10 dark:text-teal-300
    {% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white
    {% endif %} {{ class }}"
>{{ slot }}</a>
