<c-vars message timeout="4000" />
<div
  x-data="toast('{{ message.tags|default:'info' }}', {{ timeout }})"
  x-init="init()"
  x-show="show"
  x-cloak
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border px-4 py-3 text-sm shadow-lg
    {% if message.tags == 'success' %}border-teal-200 bg-teal-50 text-teal-800 dark:border-teal-500/30 dark:bg-teal-500/10 dark:text-teal-300
    {% elif message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300
    {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300
    {% else %}border-slate-200 bg-white text-slate-700 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200
    {% endif %}"
>
  <span class="mt-0.5">
    {% if message.tags == 'success' %}✓{% elif message.tags == 'error' %}✕{% elif message.tags == 'warning' %}!{% else %}ℹ{% endif %}
  </span>
  <p class="flex-1">{{ message }}</p>
  <button type="button" @click="show = false" class="ml-auto shrink-0 opacity-50 hover:opacity-100" aria-label="Dismiss">&times;</button>
</div>
