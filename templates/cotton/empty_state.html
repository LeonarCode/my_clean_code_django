<c-vars title="Nothing here yet" description="" icon="📚" />
<div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-300 bg-white/60 px-6 py-16 text-center dark:border-slate-700 dark:bg-slate-900/40">
  <div class="text-4xl">{{ icon }}</div>
  <h3 class="mt-4 text-lg font-semibold text-slate-900 dark:text-white">{{ title }}</h3>
  {% if description %}
  <p class="mt-1 max-w-sm text-sm text-slate-500 dark:text-slate-400">{{ description }}</p>
  {% endif %}
  {% if slot %}<div class="mt-6">{{ slot }}</div>{% endif %}
</div>
